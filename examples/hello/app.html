<!doctype html><html><head><meta charset="utf-8"><title>Hello app</title>
<style>
body{margin:0;font:22px/1.5 -apple-system,Helvetica,sans-serif;background:#111827;color:#e5e7eb}
main{max-width:760px;margin:80px auto}
button{font:inherit;padding:12px 28px;border:0;border-radius:10px;background:#2563eb;color:white;cursor:pointer}
#result{margin-top:36px;padding:24px;border-radius:12px;background:#1f2937;display:none}
</style></head><body><main>
<h1>Nightly report</h1>
<p>Build the report for last night's builds.</p>
<button id="run">Run report</button>
<div id="result"><b>3 builds failed.</b><br>2 timed out (checkout), 1 missing setting (billing).</div>
</main><script>
document.getElementById('run').onclick = () => {
  document.getElementById('run').textContent = 'Running…';
  setTimeout(() => { document.getElementById('result').style.display = 'block';
                     document.getElementById('run').textContent = 'Run report'; }, 8000);
};
</script></body></html>
